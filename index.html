<!DOCTYPE html>
<html>
  <head>
    <title>My first Rogue like game</title> 
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/style.css" />
    <style>

    </style>
  </head>
  <body>
    <img id="game-sprites" src="./assets/game-sprites.png" />
    <div id="game-stage">
      <canvas id="game"></canvas>
      <canvas id="mini-map"></canvas>
    </div>
    <div id="debug-controls">
      <div id="player-control">
        <div>
          <input id="player-speed" type="number" min="0" value="10" />
          <button id="set-player-speed-button">Set player speed</button>
          <button id="set-player-speed-to-default-button">Set player speed to default</button>
        </div>
        <div>
          <input id="player-view-distance" type="number" min="0" step="1" value="10" />
          <button id="set-player-view-distance-button">Set player view distance</button>
          <button id="set-player-view-distance-to-default-button">Set player view distance to default</button>
        </div>
        <div>
          <label for="enemy">Enemy</label>
          <input type="radio" id="enemy" name="placement" value="enemy" />
          <label for="fireplace">Fireplace</label>
          <input type="radio" id="fireplace" name="placement" value="fireplace" checked />
        </div>
      <div id="buttons-control">
        <button id="save-map-button" type="button">Save map</button>
        <button id="load-map-button" type="button">Load saved map</button>
        <button id="generate-map-button" type="button">Generate new map</button>
        <button id="debug-button" type="button">Debug mode</button>
        <button id="freelook-button" type="button">Freelook mode</button>
        <button id="change-map-sprite" type="button">Change map sprite</button>
        <button id="zoom-out" type="button">-</button>
        <button id="zoom-in" type="button">+</button>
      </div>
      </div>
    </div>
    <script src="./dist/index.js" type="module"></script>
  </body>
</html>
